Analyse de 2 400 abonnés - Données déséquilibrées, taux de désabonnement faible (9,29%)

Ce projet analyse les facteurs de churn chez Miras et propose des stratégies de rétention.

## Structure des fichiers
- \`Miras_Churn_Analysis.ipynb\` : Notebook principal avec l'analyse complète
- \`data/miras_churn_2400.csv\` : Dataset de 2400 abonnés
- \`requirements.txt\` : Dépendances Python

## Principaux résultats
1. **MonthlyCharges** : Facteur le plus important - les charges élevées augmentent le churn
2. **Tenure** : Clients avec ancienneté < 12 mois plus à risque
3. **Contract Type** : Contrats mensuels plus risqués que annuels

## Recommandation
Offrir une remise de 15% aux clients à haut MonthlyCharges avec ancienneté < 12 mois pour réduire le churn.

## Auteur
Amel Ben Nasr - Miras Churn Analysis Project
